name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Publish LGM at /lgm
        run: |
          set -euo pipefail
          DEST=frontend/dist/frontend/browser/lgm
          mkdir -p "$DEST"
          # Static wireframe only — skip tools/, tests/, build tooling, and local dist/
          cp -a LGM/wireframe/*.{js,html,css} "$DEST"/
          cp -a LGM/wireframe/assets "$DEST"/
          test -f "$DEST/index.html"
          test -d "$DEST/assets"

      - name: Add CNAME
        run: echo "mcart.space" > frontend/dist/frontend/browser/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist/frontend/browser
